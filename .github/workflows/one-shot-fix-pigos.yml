name: One-shot PigOS repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-pigos.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix work-time input spacing on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = ".worktimegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.worktimegrid label{font-size:12px;color:#8b7d76}.worktimegrid input{width:100%;margin-top:5px;border:1px solid #e4d6cf;background:#fffaf7;border-radius:12px;padding:10px;font-size:15px;color:#382f2b}"
          new = ".worktimegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:10px}.worktimegrid>*{min-width:0}.worktimegrid label{font-size:12px;color:#8b7d76;min-width:0;display:block}.worktimegrid input{display:block;width:100%;min-width:0;max-width:100%;margin-top:5px;border:1px solid #e4d6cf;background:#fffaf7;border-radius:12px;padding:10px;font-size:15px;color:#382f2b}"

          if old not in s:
            raise SystemExit('Expected worktime CSS pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/pigos.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/pigos.js

      - name: Commit repaired PigOS
        run: |
          git config user.name "PigOS Repair Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Fix PigOS work-time input spacing"
          git push
